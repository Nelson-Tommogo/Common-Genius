name: Deploy nelsontommogo.smartmavuno.com to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            set -e
            cd /var/www/nelsontommogo.smartmavuno.com

            echo "Pulling latest code..."
            git pull origin main

            echo "Installing dependencies..."
            pnpm install --no-frozen-lockfile || npm install

            echo "Cleaning previous build..."
            rm -rf .next out

            echo "Building static export..."
            NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" pnpm run build || \
            NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" npm run build

            echo "Fixing permissions..."
            chown -R www-data:www-data out
            chmod -R 755 out

            echo "Reloading nginx..."
            nginx -t && systemctl reload nginx

            echo "Static site deployed successfully!"